# Supabase's free plan pauses a project after about a week without requests,
# which takes the community feed and account sync offline. This pings the
# project twice a week so it stays awake even when nobody opens the app.
# (The URL and publishable key are the same public values the app ships with.)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 * * 1,4'   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the community table
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://icnbwjbcpjonzbuyhqvm.supabase.co/rest/v1/community_posts?select=id&limit=1' \
            -H 'apikey: sb_publishable_l9_aI03xoYR1tcvMwwvYgw_-tjh4b56')
          echo "Supabase responded $code"
          test "$code" = "200"
